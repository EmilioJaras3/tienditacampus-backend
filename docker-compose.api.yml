version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tc-prod-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      # URL/IP de la Base de Datos. Poner la IP publica o privada del EC2 de DB.
      - POSTGRES_HOST=${POSTGRES_HOST:-172.31.13.248}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-tienditacampus}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_password}
      - NODE_ENV=production
      - BACKEND_PORT=3001
      - JWT_SECRET=${JWT_SECRET:-fallback_secret_key_12345}
      - JWT_EXPIRATION=7d
      - BCRYPT_SALT_ROUNDS=12
